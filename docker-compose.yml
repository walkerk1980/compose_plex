---
version: "2.1"
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    # container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
      - PLEX_CLAIM=$PLEX_CLAIM
    volumes:
      - config:/config
      - transcode:/transcode
      - /mnt/14TB/Movies:/Movies
      - /mnt/14TB/TV:/TV
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
volumes:
  config:
    # The config volume lives on the big disk, not on / (moved 2026-09-14).
    # NOTE: the directory must exist and be owned by PUID/PGID (1000:1000)
    # before the volume is first created, or the app cannot write to it.
    driver: local
    driver_opts:
      type: none
      device: /mnt/HG12TB/docker/plex/config
      o: bind
  transcode:

